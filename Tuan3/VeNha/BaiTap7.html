
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài tập 7 - CSS Website Layout</title>

    <style>
        /* Định dạng chung */
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px 20px;
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            color: #222;
        }

        h1 {
            text-align: center;
            font-size: 24px;
            margin-bottom: 30px;
        }

        /* Khung chứa toàn bộ website */
        #wrapper {
            width: 600px;
            max-width: 100%;
            margin: 0 auto;
            padding: 8px;
            border: 3px solid #333;
            background-color: #fff;
        }

        /* Định dạng chung cho 4 khu vực */
        #wrapper header,
        #wrapper nav,
        #wrapper main,
        #wrapper footer {
            border: 2px solid #333;
            padding: 12px;
        }

        /* Header nằm phía trên */
        #wrapper header {
            height: 85px;
            margin-bottom: 8px;
        }

        /* Nav bên trái, Main bên phải */
        .content-layout {
            display: flex;
            gap: 8px;
            min-height: 330px;
            margin-bottom: 8px;
        }

        #wrapper nav {
            width: 23%;
            flex-shrink: 0;
        }

        #wrapper main {
            flex: 1;
            min-width: 0;
        }

        /* Footer nằm phía dưới */
        #wrapper footer {
            height: 65px;
        }

        /* Quay lại trang tổng hợp */
        .back-link {
            display: block;
            width: fit-content;
            margin: 30px auto 0;
            color: #087d83;
            text-decoration: none;
        }

        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <h1>BÀI TẬP 7 - BỐ CỤC WEBSITE</h1>

    <!-- HTML dựa theo cấu trúc đề bài -->
    <div id="wrapper">

        <header>header</header>

        <div class="content-layout">
            <nav>nav</nav>
            <main>main</main>
        </div>

        <footer>footer</footer>

    </div>

    <a class="back-link" href="./index.html">
        ← Quay lại danh sách bài tập
    </a>
</body>
</html>
