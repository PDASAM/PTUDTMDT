        float: left;
        width: 70%;
      }

      .right {
        background: red;
        float: right;
        width: 30%;
      }
      @media only screen and (max-width: 768px){
.left,.right{ 
width: 100%
}
}
@media only screen and (max-width: 479px) and (min-width: 321px){
.right{ display: none}

}
}
@media only print {
.left{ display: none} 
.right{ width: 100%}
}
